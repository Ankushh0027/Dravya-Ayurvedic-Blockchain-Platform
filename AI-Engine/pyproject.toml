[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dravya-ai-engine"
version = "0.1.0"
description = "Dravya AI Engine for Ayurvedic Plant Dataset Analysis and Processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "pillow",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
